name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Claude Code that validates and tests the plugin: bumped on purpose, with tools/claude-code-types refreshed from it.
  CLAUDE_CODE_VERSION: 2.1.296

# Actions are pinned to commit SHAs (the tag each one had when pinned is in the comment).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shells for the prompt hook tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: npm run typecheck
      - run: npm test
      - name: Plugin bundle is up to date
        run: npm run check:bundle
      - run: npm run build
      - name: npm package contents
        run: npm pack --dry-run
      - name: Plugin types
        # Against the committed snapshot of the pinned version's declarations (tools/claude-code-types).
        run: npm run typecheck:plugin
      - name: claude plugin validate
        run: |
          npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .
          npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict claude-plugin
      - name: claude plugin test
        # The pane's own suite (claude-plugin/tests): no session, sign-in or network.
        run: npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin test claude-plugin

  # The prompt hook in macOS's own shells: /bin/bash 3.2, Homebrew's bash on PATH, and zsh.
  macos-shells:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/notify-shells.test.ts

  # engines.node is >=20.3.0: the built CLI and the plugin bundle must at least start there.
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
      - run: node --version
      - name: Built CLI runs on Node 20
        run: HOME="$RUNNER_TEMP" node dist/cli.js help
      - name: Plugin bundle runs on Node 20
        run: HOME="$RUNNER_TEMP" node claude-plugin/scripts/mokkan.mjs help
